version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: investiq-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=investiq_production_jwt_secret_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - STOCKS_API_KEY=${STOCKS_API_KEY:-}
    volumes:
      - ./backend/src/data:/app/backend/src/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: investiq-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
